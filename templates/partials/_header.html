<header class="jo-header">
    <a href="{% url 'home' %}" class="jo-header-logo jo-h1" style="text-decoration:none;">
        <i class="ti ti-diamond"></i> Joyas Ocultas
    </a>
    <button class="jo-menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <i class="ti ti-menu-2"></i>
    </button>
    <nav id="mainNav">
        <a href="{% url 'locales:explorar' %}">Explorar</a>
        <a href="{% url 'home' %}#negocios">Para negocios</a>
        {% if user.is_authenticated %}
            <a href="{% url 'usuarios:pasaporte' %}"><i class="ti ti-diamond"></i> {{ perfil_usuario.nombre_visible }}</a>
            <form method="post" action="{% url 'usuarios:logout' %}" class="jo-logout-form">
                {% csrf_token %}
                <button type="submit" class="jo-nav-link-btn">Salir</button>
            </form>
        {% else %}
            <a href="{% url 'usuarios:login' %}">Iniciar sesión</a>
            <a href="{% url 'usuarios:registro' %}" class="jo-nav-cta">Registrarse</a>
        {% endif %}
    </nav>
</header>
